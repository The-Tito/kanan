[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanan"
version = "0.1.0"
description = "Optimización de brechas cortafuego con NSGA-II y un autómata celular de incendios"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Antonio Selvas" }]
dependencies = [
    "numpy>=1.26",
    "numba>=0.61",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pillow>=10",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.50"]

[project.scripts]
kanan = "kanan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Código de maquetación con muchas llamadas largas alineadas a mano.
"video/escenas.py" = ["E501"]
"src/kanan/interfaz/app.py" = ["E501"]
